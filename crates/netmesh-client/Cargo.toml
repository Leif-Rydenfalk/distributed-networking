[package]
name = "netmesh-client"
version = "0.1.0"
edition = "2021"
description = "net.mesh client: a full mesh node (WireGuard + smoltcp) over the relay leg WebSocket; wasm32 and native"
license = "Apache-2.0"
publish = false

# standalone until the root Cargo.toml becomes a workspace
[workspace]

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
# boringtun 0.6.0 + 3 cfg(wasm32)-only patches (vendor/boringtun/PATCH.md); device feature off, noise only
boringtun = { path = "vendor/boringtun", default-features = false }
getrandom = "0.2"
ed25519-dalek = "2.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
web-time = "1"
futures = { version = "0.3", default-features = false, features = ["std", "async-await"] }
# TCP/UDP over the tunnel: an IP interface (no Ethernet), MTU 1280 like every mesh node
smoltcp = { version = "0.12", default-features = false, features = ["std", "medium-ip", "proto-ipv4", "socket-tcp", "socket-udp", "async"] }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
tokio = { version = "1.52", features = ["rt", "macros", "time", "net", "io-util"] }
tokio-tungstenite = { version = "0.24", default-features = false, features = ["connect", "handshake", "rustls-tls-webpki-roots"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12", "logging"] }

[target.'cfg(target_arch = "wasm32")'.dependencies]
getrandom = { version = "0.2", features = ["js"] }
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
js-sys = "0.3"
web-sys = { version = "0.3", features = ["WebSocket", "BinaryType", "MessageEvent", "CloseEvent", "Event"] }

[target.'cfg(not(target_arch = "wasm32"))'.dev-dependencies]
tokio = { version = "1.52", features = ["rt-multi-thread", "macros", "time", "net", "io-util"] }
futures = { version = "0.3", features = ["std", "async-await"] }

[target.'cfg(target_arch = "wasm32")'.dev-dependencies]
wasm-bindgen-test = "0.3"
