[package]
name = "net-mesh"
version = "0.1.0"
edition = "2021"
description = "A WireGuard mesh VPN with a replicated Raft control plane, NAT traversal, a WebSocket relay and path hedging"
license = "Apache-2.0"
publish = false

[dependencies]
ed25519-dalek = "2.2"
x25519-dalek = { version = "2.0", features = ["static_secrets"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
getrandom = "0.2"
sha2 = "0.10"
# relay leg: WireGuard over one TLS WebSocket
tokio = { version = "1.52", features = ["rt-multi-thread", "macros", "net", "sync", "time", "process", "signal", "io-util"] }
tokio-tungstenite = { version = "0.24", default-features = false, features = ["connect", "handshake", "rustls-tls-webpki-roots"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12", "logging"] }
futures-util = { version = "0.3", default-features = false, features = ["sink", "std"] }
# netmesh-control as a 3-replica Raft group; v1 RaftStorage via storage::Adaptor, no storage-v2
openraft = { version = "=0.9.25", features = ["serde"] }

[profile.release]
opt-level = 3
lto = "thin"
